<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Bag - Add Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1 class="logo">Glam Bag</h1>
            <p class="tagline">add a product</p>
            <div class="deco">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="body">
            <p class="greeting">What are you adding to your bag today?</p>

            <div class="form-group">
                <label class="form-label">Product name</label>
                <input type="text" class="form-input" placeholder="e.g. MAC lipstick">
            </div>

            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-input">
                    <option value="">Select a category</option>
                    <option value="lip">Lip</option>
                    <option value="eye">Eye</option>
                    <option value="eyebrow">Eyebrow</option>
                    <option value="skin">Skin</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Expiry month</label>
                <input type="number" class="form-input" placeholder="e.g. 06" min="1" max="12">
            </div>

            <div class="form-group">
                <label class="form-label">Expiry year</label>
                <input type="number" class="form-input" placeholder="e.g. 2027" min="2024">
            </div>

            <button class="submit-btn">Add to Glam Bag</button>

            <a href="index.html" class="back-link">back to menu</a>
        </div>

        <div class="footer">
            <p class="footer-text">made with love for every girl</p>
        </div>

    </div>
</body>
</html>
