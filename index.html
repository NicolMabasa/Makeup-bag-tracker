<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Bag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1 class="logo">Glam Bag</h1>
            <p class="tagline">your beauty tracker</p>
            <div class="deco">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="body">
            <p class="greeting">Hello gorgeous, what would you like to do?</p>

            <a href="add.html" class="menu-btn">
                <div class="btn-icon">+</div>
                <div>
                    <div class="btn-text">Add a product</div>
                    <div class="btn-sub">Add to your glam collection</div>
                </div>
            </a>

            <a href="delete.html" class="menu-btn">
                <div class="btn-icon">x</div>
                <div>
                    <div class="btn-text">Delete a product</div>
                    <div class="btn-sub">Remove from your bag</div>
                </div>
            </a>

            <a href="view.html" class="menu-btn">
                <div class="btn-icon">*</div>
                <div>
                    <div class="btn-text">View all products</div>
                    <div class="btn-sub">See your full collection</div>
                </div>
            </a>

            <a href="search.html" class="menu-btn">
                <div class="btn-icon">?</div>
                <div>
                    <div class="btn-text">Search a product</div>
                    <div class="btn-sub">Find something specific</div>
                </div>
            </a>
        </div>

        <div class="footer">
            <p class="footer-text">made with love for every girl</p>
        </div>

    </div>
</body>
</html>
