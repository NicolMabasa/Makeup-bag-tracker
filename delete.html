<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Bag - Delete Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1 class="logo">Glam Bag</h1>
            <p class="tagline">remove a product</p>
            <div class="deco">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="body">
            <p class="greeting">Which product would you like to remove?</p>

            <div class="form-group">
                <label class="form-label">Select a category</label>
                <select class="form-input" id="categorySelect">
                    <option value="">Choose a category</option>
                    <option value="lip">Lip</option>
                    <option value="eye">Eye</option>
                    <option value="eyebrow">Eyebrow</option>
                    <option value="skin">Skin</option>
                </select>
            </div>

            <div class="product-list" id="productList">

                <div class="product-card">
                    <div class="product-info">
                        <p class="product-name">MAC Lipstick</p>
                        <p class="product-date">Expires: 06/2027</p>
                    </div>
                    <button class="delete-btn">Remove</button>
                </div>

                <div class="product-card">
                    <div class="product-info">
                        <p class="product-name">Lip Liner</p>
                        <p class="product-date">Expires: 04/2026</p>
                    </div>
                    <button class="delete-btn">Remove</button>
                </div>

            </div>

            <a href="index.html" class="back-link">back to menu</a>
        </div>

        <div class="footer">
            <p class="footer-text">made with love for every girl</p>
        </div>

    </div>
</body>
</html>
