<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Bag - Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1 class="logo">Glam Bag</h1>
            <p class="tagline">search your bag</p>
            <div class="deco">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="body">
            <p class="greeting">Looking for something specific?</p>

            <div class="form-group">
                <label class="form-label">Product name</label>
                <input type="text" class="form-input" 
                placeholder="e.g. MAC lipstick" id="searchInput">
            </div>

            <button class="submit-btn">Search</button>

            <div class="search-result" id="searchResult">
                <div class="product-card">
                    <div class="product-info">
                        <p class="product-name">MAC Lipstick</p>
                        <p class="product-date">Expires: 06/2027</p>
                        <p class="product-category">Category: Lip</p>
                    </div>
                    <span class="badge badge-good">Good</span>
                </div>
            </div>

            <a href="index.html" class="back-link">back to menu</a>
        </div>

        <div class="footer">
            <p class="footer-text">made with love for every girl</p>
        </div>

    </div>
</body>
</html>
